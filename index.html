<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pixel World - Mirip Growtopia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>⛏️ Pixel World</h1>
<div id="sub">A/D atau ←/→ = jalan • Spasi/↑ = lompat • Klik kiri = gali • Klik kanan = taruh blok • 1-6 pilih blok</div>
<div id="gameWrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="msg"></div>
  <div id="touchControls">
    <div class="ctlBtn" id="btnLeft">◀</div>
    <div class="ctlBtn" id="btnRight">▶</div>
  </div>
  <div id="jumpControl">
    <div class="ctlBtn" id="btnPunch">✊</div>
    <div class="ctlBtn" id="btnJump">⤒</div>
  </div>
</div>
<div id="hotbar"></div>
<div id="stats">
  <span id="posInfo">Posisi: -</span>
  <span id="invInfo">Item terkumpul: 0</span>
</div>

<script src="game.js"></script>
</body>
</html>
